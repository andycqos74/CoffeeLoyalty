services:
  loyaltyapp:
    image: ghcr.io/andycqos74/coffeeloyalty:latest
    container_name: loyaltyapp
    restart: unless-stopped
    ports:
      - "3002:8080"
    volumes:
      # Only the database directory is persisted — app binaries always come from the image.
      - loyalty_data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/api/admin/wallet-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  loyalty_data:
    driver: local
