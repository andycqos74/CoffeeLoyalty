# One container per site. Every site runs the same image; THEME picks its look and starting words
# (a folder in themes/), and each site keeps its own database and uploaded photos in its own volume.
services:
  loyaltyapp:
    image: ghcr.io/andycqos74/coffeeloyalty:latest
    container_name: loyaltyapp
    restart: unless-stopped
    ports:
      - "3002:8080"
    volumes:
      # Only the data directory is persisted (database + photos uploaded in Admin -> Pages);
      # app binaries and themes always come from the image.
      - loyalty_data:/app/data
      # A theme kept on the server instead of in the image (then set THEME_DIR=/app/custom-theme):
      # - ./my-theme:/app/custom-theme:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # qosfc (Queen of the South Café) or cairndale (The Oak at the Cairndale)
      - THEME=qosfc
      # Optional: lets admins describe a photo animation and have Claude propose the settings
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - ANIMATE_MODEL=claude-opus-5-5
      # - ANIMATE_EFFORT=medium
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/api/admin/wallet-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # A second site from the same image, e.g. The Oak at the Cairndale:
  # cairndale:
  #   image: ghcr.io/andycqos74/coffeeloyalty:latest
  #   container_name: loyalty-cairndale
  #   restart: unless-stopped
  #   ports:
  #     - "3003:8080"
  #   volumes:
  #     - cairndale_data:/app/data
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ASPNETCORE_URLS=http://+:8080
  #     - THEME=cairndale
  #     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

volumes:
  loyalty_data:
    driver: local
  # cairndale_data:
  #   driver: local
