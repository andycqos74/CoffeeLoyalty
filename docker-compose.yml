services:
  loyaltyapp:
    image: ghcr.io/andycqos74/coffeeloyalty:latest
    container_name: loyaltyapp
    restart: unless-stopped
    ports:
      - "3002:8080"
    volumes:
      # Database and client-uploaded brand assets. App binaries always come from the image.
      - loyalty_data:/app/data
      # Per-client provisioning seed, read-only. See clients/README.md. Optional: without
      # it the app runs on built-in defaults and whatever the admin Branding tab has saved.
      - ./clients/qosfc:/app/config:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Host allowlist. Comma-separated; omit to allow any host.
      # - ALLOWED_HOSTS=qos.myloyalty.com,loyalty.mycafe.com
      # Networks whose X-Forwarded-Proto/-For headers are trusted. The default covers
      # loopback and the RFC1918 ranges Docker networks use, which is what cloudflared or
      # a reverse proxy container connects from. Set to "none" to ignore the headers.
      # - TRUSTED_PROXY_NETWORKS=172.16.0.0/12
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/api/admin/wallet-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  loyalty_data:
    driver: local
